<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="shared.css">
<style>
  /* 狂潮红脉冲 */
  .frenzy-edge{position:absolute;inset:0;z-index:30;pointer-events:none;
    box-shadow:inset 0 0 90px rgba(255,77,94,.30), inset 0 0 30px rgba(255,77,94,.18);}
  .hud-top{position:absolute;top:0;left:0;right:0;z-index:20;padding:12px 14px 0}
  .hud-r1{display:flex;align-items:center;gap:10px}
  .hpwrap{width:46%}
  .hpwrap .cap{display:flex;justify-content:space-between;font-size:10px;margin-bottom:3px}
  .chap{margin-left:auto;text-align:right}
  .chap .c1{font-size:12px;color:var(--t2);font-weight:700}
  .chap .c2{font-size:17px;font-weight:800;color:var(--t1)}
  .chap .c2 b{color:var(--gold)}
  .hud-r2{display:flex;align-items:center;gap:8px;margin-top:8px}
  /* 竞技场 */
  .arena{position:absolute;left:10px;right:10px;top:96px;bottom:140px;z-index:2}
  .arena .frame{position:absolute;inset:0;border:1px solid rgba(126,150,200,.20);border-radius:10px;
    background:
      radial-gradient(60% 40% at 50% 46%, rgba(60,80,140,.10), transparent 70%),
      repeating-linear-gradient(0deg, rgba(120,150,220,.028) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(120,150,220,.028) 0 1px, transparent 1px 44px);}
  .corner{position:absolute;width:14px;height:14px;border:2px solid rgba(90,200,250,.4)}
  .obstacle{position:absolute;border-radius:8px;background:linear-gradient(160deg,#1B2333,#0D1119);
    border:1px solid rgba(126,150,200,.22);box-shadow:0 6px 14px rgba(0,0,0,.5)}
  /* 玩家 */
  .player{position:absolute;left:228px;top:392px;width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #FFFFFF, #9FE8FF 55%, #4AC8E8);
    box-shadow:0 0 18px 4px rgba(127,216,255,.55)}
  .player .ring{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;
    border-radius:50%;border:1px solid rgba(127,216,255,.45);box-shadow:0 0 12px rgba(127,216,255,.25) inset}
  .nova{position:absolute;left:240px;top:404px;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;
    border:3px solid rgba(255,157,46,.65);box-shadow:0 0 22px rgba(255,157,46,.4), inset 0 0 22px rgba(255,157,46,.18);
    mask:linear-gradient(120deg,#000 55%,transparent 92%)}
  /* 飞刀 */
  .knife{position:absolute;width:5px;height:20px;border-radius:3px;
    background:linear-gradient(180deg,#FFFFFF,#9FE8FF);box-shadow:0 0 10px 2px rgba(127,216,255,.75);transform:rotate(38deg)}
  .knife::after{content:"";position:absolute;left:1px;top:18px;width:3px;height:44px;border-radius:2px;
    background:linear-gradient(180deg,rgba(127,216,255,.5),transparent)}
  /* 敌人 */
  .en{position:absolute;border-radius:50%;background:radial-gradient(circle at 38% 30%, #38415A, #1A2030 70%);
    border:1px solid rgba(0,0,0,.55);box-shadow:0 4px 10px rgba(0,0,0,.45)}
  .en::before,.en::after{content:"";position:absolute;top:32%;width:3px;height:3px;border-radius:50%;
    background:#FF5A6E;box-shadow:0 0 6px rgba(255,90,110,.9)}
  .en::before{left:26%}.en::after{right:26%}
  .en.elite{background:radial-gradient(circle at 38% 30%, #4A3A6E, #221A38 70%)}
  .en.elite i{position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(192,108,255,.55);
    box-shadow:0 0 12px rgba(192,108,255,.3)}
  .en.ghost{opacity:.32;filter:saturate(.4)}
  .en.ref i{position:absolute;inset:-5px;border-radius:50%;border:1px dashed rgba(255,157,46,.5)}
  /* 毒云 / 骷髅 */
  .cloud{position:absolute;border-radius:50%;filter:blur(6px);
    background:radial-gradient(circle, rgba(122,220,140,.30), rgba(122,220,140,.10) 60%, transparent 75%)}
  .skel{position:absolute;width:14px;height:18px}
  .skel::before{content:"";position:absolute;left:3px;top:0;width:8px;height:8px;border-radius:50%;
    background:#DDE4EE;box-shadow:0 0 8px rgba(221,228,238,.5)}
  .skel::after{content:"";position:absolute;left:5px;top:8px;width:4px;height:10px;background:#B9C2D2;border-radius:2px}
  /* 金币与飘字 */
  .coin{position:absolute;width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #FFF2C0, #FFD76A 60%, #C89B2E);
    box-shadow:0 0 8px rgba(255,215,106,.8)}
  .flt{position:absolute;font-size:12px;font-weight:800;text-shadow:0 1px 3px #000}
  .flt.dmg{color:#FFFFFF} .flt.dmg2{color:#FFB0B8} .flt.gd{color:var(--gold)}
  /* 底部 HUD */
  .hud-bot{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 14px 14px;
    display:flex;justify-content:space-between;align-items:flex-end;
    background:linear-gradient(180deg,transparent, rgba(5,7,11,.82) 40%)}
  .frenzy{display:flex;flex-direction:column;gap:6px}
  .frenzy .big{font-size:17px;font-weight:800;color:#FF8A5E;letter-spacing:.06em;
    text-shadow:0 0 14px rgba(255,77,94,.65)}
  .frenzy .bar{width:150px;height:4px;border-radius:2px;background:#24141C;overflow:hidden}
  .frenzy .bar i{display:block;height:100%;width:62%;background:linear-gradient(90deg,#FF4D5E,#FF9D2E);
    box-shadow:0 0 8px rgba(255,120,80,.8)}
  .bot-right{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
  .auto-chip{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--act);font-weight:700}
  .auto-chip .dot{width:7px;height:7px;border-radius:50%;background:var(--act);box-shadow:0 0 8px var(--act)}
  .combo{position:absolute;left:50%;bottom:118px;transform:translateX(-50%);z-index:15;text-align:center}
  .combo .n{font-size:13px;font-weight:800;color:var(--t2)}
</style>
</head>
<body>
<div class="screen">
  <div class="shafts"></div>

  <div class="arena">
    <div class="frame"></div>
    <div class="corner" style="left:-1px;top:-1px;border-right:0;border-bottom:0"></div>
    <div class="corner" style="right:-1px;top:-1px;border-left:0;border-bottom:0"></div>
    <div class="corner" style="left:-1px;bottom:-1px;border-right:0;border-top:0"></div>
    <div class="corner" style="right:-1px;bottom:-1px;border-left:0;border-top:0"></div>
    <div class="obstacle" style="left:52px;top:96px;width:74px;height:34px"></div>
    <div class="obstacle" style="right:44px;bottom:120px;width:88px;height:38px"></div>

    <div class="cloud" style="left:40px;bottom:44px;width:150px;height:110px"></div>
    <div class="nova"></div>

    <!-- 敌人 -->
    <div class="en" style="left:86px;top:150px;width:26px;height:26px"></div>
    <div class="en" style="left:150px;top:236px;width:24px;height:24px"></div>
    <div class="en ref" style="left:338px;top:180px;width:26px;height:26px"><i></i></div>
    <div class="en elite" style="left:368px;top:330px;width:40px;height:40px"><i></i></div>
    <div class="en" style="left:300px;top:470px;width:25px;height:25px"></div>
    <div class="en" style="left:120px;top:470px;width:24px;height:24px"></div>
    <div class="en ghost" style="left:196px;top:560px;width:24px;height:24px"></div>
    <div class="en" style="left:330px;top:560px;width:22px;height:22px"></div>
    <div class="en" style="left:60px;top:330px;width:23px;height:23px"></div>

    <!-- 骷髅召唤物 -->
    <div class="skel" style="left:196px;top:368px"></div>
    <div class="skel" style="left:286px;top:428px"></div>

    <!-- 玩家 + 飞刀扇 -->
    <div class="player"><div class="ring"></div></div>
    <div class="knife" style="left:284px;top:352px"></div>
    <div class="knife" style="left:304px;top:322px"></div>
    <div class="knife" style="left:324px;top:292px"></div>

    <!-- 金币 -->
    <div class="coin" style="left:120px;top:206px"></div>
    <div class="coin" style="left:142px;top:214px"></div>
    <div class="coin" style="left:352px;top:240px"></div>
    <div class="coin" style="left:246px;top:520px"></div>
    <div class="coin" style="left:262px;top:530px"></div>

    <!-- 飘字 -->
    <div class="flt dmg" style="left:366px;top:306px">-128</div>
    <div class="flt dmg2" style="left:96px;top:128px">-46</div>
    <div class="flt gd" style="left:128px;top:182px">+2</div>
    <div class="flt gd" style="left:250px;top:498px">+3</div>
  </div>

  <div class="combo"><div class="n">击杀 214</div></div>

  <div class="hud-top">
    <div class="hud-r1">
      <div class="hpwrap">
        <div class="cap"><span style="color:var(--hp);font-weight:800">❤ 生命</span><span class="num" style="color:var(--t2)">86 / 100</span></div>
        <div class="hpbar"><div class="fill" style="width:86%"></div></div>
      </div>
      <div class="chap">
        <div class="c1">第 3 关 · 章节 <b>3 / 20</b></div>
        <div class="c2">剩余 <b>42</b> s</div>
      </div>
    </div>
    <div class="hud-r2">
      <div class="cur gold"><span class="ic">✦</span><span class="num">214</span></div>
      <div class="chip env">☄ 反伤领域</div>
      <div class="chip env">✸ 死亡连锁</div>
    </div>
  </div>

  <div class="frenzy-edge"></div>

  <div class="hud-bot">
    <div class="frenzy">
      <div class="big">狂潮!连杀 ×12</div>
      <div class="bar"><i></i></div>
      <div style="display:flex;gap:6px">
        <div class="chip ok">✚ 荆棘回血激活</div>
      </div>
    </div>
    <div class="bot-right">
      <div class="btn btn-secondary" style="width:96px">商店 →</div>
      <div class="auto-chip"><span class="dot"></span>挂机中 · F6 接管</div>
    </div>
  </div>
</div>
</body>
</html>
