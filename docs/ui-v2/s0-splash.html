<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><link rel="stylesheet" href="shared.css">
<style>
  .ring{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none}
  .r1{width:460px;height:460px;border:1px solid rgba(127,216,255,.14)}
  .r2{width:340px;height:340px;border:1px dashed rgba(200,182,255,.22)}
  .r3{width:560px;height:560px;border:1px solid rgba(200,182,255,.07)}
  .glow-core{position:absolute;left:50%;top:40%;width:260px;height:260px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle, rgba(77,255,200,.14), rgba(127,216,255,.05) 45%, transparent 70%)}
  .fog{position:absolute;left:-40px;right:-40px;bottom:-30px;height:240px;pointer-events:none;z-index:2;
    background:
      radial-gradient(60% 90% at 30% 100%, rgba(46,60,110,.5), transparent 70%),
      radial-gradient(55% 80% at 75% 100%, rgba(30,48,80,.45), transparent 70%);
    filter:blur(6px)}
  .title-box{position:absolute;left:0;right:0;top:30%;text-align:center;z-index:5}
  .title{font-size:56px;font-weight:900;letter-spacing:.14em;
    background:linear-gradient(180deg,#F4F8FF 20%, #BFD2FF 55%, #7FD8FF 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(127,216,255,.35)) drop-shadow(0 2px 2px rgba(0,0,0,.6))}
  .subtitle{margin-top:10px;font-size:13px;letter-spacing:.62em;color:var(--t2);text-indent:.62em}
  .tagline{margin-top:22px;font-size:12.5px;color:var(--t2);letter-spacing:.18em}
  .tagline b{color:var(--act);font-weight:700}
  .divider{width:190px;height:1px;margin:20px auto 0;
    background:linear-gradient(90deg,transparent, rgba(127,216,255,.6), transparent)}
  .enter{position:absolute;left:50%;transform:translateX(-50%);bottom:120px;width:250px;z-index:6}
  .ver{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-size:10px;color:var(--t3);z-index:6}
  .rune{position:absolute;font-size:11px;color:rgba(127,216,255,.4);letter-spacing:.3em;z-index:1}
</style></head>
<body><div class="screen">
  <div class="shafts"></div>
  <div class="ring r3"></div><div class="ring r1"></div><div class="ring r2"></div>
  <div class="glow-core"></div>
  <div class="dust" style="left:70px;top:150px"></div>
  <div class="dust v" style="left:390px;top:220px"></div>
  <div class="dust" style="left:120px;top:520px;opacity:.35"></div>
  <div class="dust v" style="left:330px;top:610px;opacity:.4"></div>
  <div class="dust g" style="left:210px;top:690px;opacity:.45"></div>
  <div class="rune" style="left:56px;top:236px">◈ ◇ ◈</div>
  <div class="rune" style="right:52px;top:470px">◇ ◈ ◇</div>

  <div class="title-box">
    <div class="title">回响深渊</div>
    <div class="subtitle">ECHO ABYSS</div>
    <div class="divider"></div>
    <div class="tagline">挂机放置 · <b>词缀构筑</b> · 尸潮割草</div>
  </div>

  <div class="fog"></div>
  <div class="enter btn btn-primary">点 击 进 入 深 渊</div>
  <div class="ver">v0.1 · 核心循环 MVP · 微信小游戏</div>
</div></body></html>
