<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>主菜单布局工作台(dev)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070c;
      }
      /* 底图仍是真游戏的 #game 画布(platform.createCanvas 按 id 取它),工作台只往上叠浮层与面板 */
      #game {
        display: block;
        background: #0b0e14;
      }
      canvas {
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <script type="module" src="/src/dev/layoutWorkbench.ts"></script>
  </body>
</html>
